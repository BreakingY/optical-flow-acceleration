aipp_op {
    aipp_mode: static
    related_input_rank: 0
    input_format :  RGB888_U8
    src_image_size_w : 640
    src_image_size_h : 480

    # 1. 核心修改：输入已经是 BGR/RGB 家族，无需色彩空间转换（CSC）
    csc_switch : false
    
    # 2. 核心修改：在 NPU 硬件内直接将 BGR 交换为 RGB 输送给模型
    rbuv_swap_switch : true

    # 关闭 Crop
    crop: false 

    # 3. 归一化配置：pixel_out_chx(i)=[pixel_in_chx(i)-mean_chn_i-min_chn_i]*var_reci_chn_i
    # NeuFlow归一化操作为R = R /255.0
    min_chn_0 : 0 
    min_chn_1 : 0
    min_chn_2 : 0
    mean_chn_0: 0
    mean_chn_1: 0
    mean_chn_2: 0
    var_reci_chn_0: 0.003921568627451
    var_reci_chn_1: 0.003921568627451
    var_reci_chn_2: 0.003921568627451
}
