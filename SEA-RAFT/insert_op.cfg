# 输入 [H, W] = [432, 960]
# 输出 flow_final = 1, 2, H, W, info_final = 1, 4, H, W
# aipp_op
# {
#     aipp_mode: dynamic
#     related_input_rank: 0       # 标识对第1个输入进行AIPP处理
#     max_src_image_size: 1244160  # 输入图像最大的size(RGB:n*w*h*3 YUV420:n*w*h*3/2)，参数必填
# }
# aipp_op
# {
#     aipp_mode: dynamic
#     related_input_rank: 1       # 标识对第2个输入进行AIPP处理
#     max_src_image_size: 1244160  # 输入图像最大的size(RGB:n*w*h*3 YUV420:n*w*h*3/2)，参数必填
# }
aipp_op {
    aipp_mode: static
    related_input_rank: 0
    input_format :  RGB888_U8
    src_image_size_w : 960
    src_image_size_h : 432

    # 1. 核心修改：输入已经是 BGR/RGB 家族，无需色彩空间转换（CSC）
    csc_switch : false
    
    # 2. 核心修改：在 NPU 硬件内直接将 BGR 交换为 RGB 输送给模型
    rbuv_swap_switch : true

    # 关闭 Crop
    crop: false 

    # 3. 归一化配置：pixel_out_chx(i)=[pixel_in_chx(i)-mean_chn_i-min_chn_i]*var_reci_chn_i
    # sea-raft归一化操作在模型内部
    # min_chn_0 : 0 
    # min_chn_1 : 0
    # min_chn_2 : 0
    # mean_chn_0: 128
    # mean_chn_1: 128
    # mean_chn_2: 128
    # var_reci_chn_0: 0.00784313725490196
    # var_reci_chn_1: 0.00784313725490196
    # var_reci_chn_2: 0.00784313725490196
}
aipp_op {
    aipp_mode: static
    related_input_rank: 1
    input_format :  RGB888_U8
    src_image_size_w : 960
    src_image_size_h : 432

    # 1. 核心修改：输入已经是 BGR/RGB 家族，无需色彩空间转换（CSC）
    csc_switch : false
    
    # 2. 核心修改：在 NPU 硬件内直接将 BGR 交换为 RGB 输送给模型
    rbuv_swap_switch : true

    # 关闭 Crop
    crop: false 

    # 3. 归一化配置：pixel_out_chx(i)=[pixel_in_chx(i)-mean_chn_i-min_chn_i]*var_reci_chn_i
    # sea-raft归一化操作在模型内部
}